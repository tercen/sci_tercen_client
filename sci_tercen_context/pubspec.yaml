name: sci_tercen_context
description: Tercen operator context library for Dart.
version: 1.17.1
publish_to: none

environment:
  sdk: ^3.3.0

dependencies:
  sci_tercen_client:
    git:
      ref: 1.17.1
      url: https://github.com/tercen/sci_tercen_client
      path: sci_tercen_client
#  sci_tercen_client:
#    path: ../sci_tercen_client
  tson:
    git:
      url: https://github.com/tercen/dtson
      ref: 1.5.1

# Path overrides keep this multi-package repo self-coherent: each package
# builds against the sibling packages in this checkout instead of the last
# published git ref (which lags main between release tags). pub publish
# strips dependency_overrides, so publishing is unaffected.
dependency_overrides:
  sci_tercen_model:
    path: ../sci_tercen_model
  sci_tercen_client:
    path: ../sci_tercen_client
  sci_base:
    path: ../sci_base
  sci_http_client:
    path: ../sci_http_client

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
  sci_base:
    git:
      ref: 1.17.1
      url: https://github.com/tercen/sci_tercen_client
      path: sci_base
